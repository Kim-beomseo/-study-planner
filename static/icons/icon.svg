<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="eduweGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#eduweGrad)" />
  <!-- Center emblem: Graduation Cap & Letter W -->
  <g filter="url(#shadow)" fill="#111827">
    <!-- Graduation Cap Top -->
    <polygon points="256,120 400,190 256,260 112,190" />
    <!-- Cap Underneath Base -->
    <path d="M168,220 L168,285 C168,335 344,335 344,285 L344,220 L256,262 Z" />
    <!-- Cap Tassel -->
    <path d="M380,200 L400,280 C395,295 405,295 400,310" stroke="#111827" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Letter W in Bold Eduwe style -->
    <path d="M150,330 L195,440 L256,380 L317,440 L362,330 L322,330 L292,405 L256,365 L220,405 L190,330 Z" />
  </g>
  <!-- Yellow accent dot on top -->
  <circle cx="256" cy="190" r="14" fill="#ffd200" />
</svg>
